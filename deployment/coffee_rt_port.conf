[program:coffee_rt_port]
command=/bin/bash /workspace/run_coffee_rt_port.sh
directory=/workspace/Ex4DGS
environment=OMP_NUM_THREADS="8",OPENBLAS_NUM_THREADS="8",CUDA_HOME="/workspace/cuda-11.8",PATH="/workspace/cuda-11.8/bin:/workspace/venvs/ex4dgs/bin:/usr/bin:/bin",CC="gcc-11",CXX="g++-11",TORCH_CUDA_ARCH_LIST="8.6"
autostart=false
autorestart=false
startsecs=3
stdout_logfile=/workspace/coffee-rt-port.log
stdout_logfile_maxbytes=20000000
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
