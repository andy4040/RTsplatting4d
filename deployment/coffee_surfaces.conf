[program:coffee_surfaces]
command=/workspace/venvs/ex4dgs/bin/python -u /workspace/continue_coffee_surfaces.py
directory=/workspace/Ex4DGS
environment=OMP_NUM_THREADS="8",OPENBLAS_NUM_THREADS="8"
autostart=false
autorestart=false
startsecs=3
stdout_logfile=/workspace/coffee-surfaces.log
stdout_logfile_maxbytes=20000000
stdout_logfile_backups=3
redirect_stderr=true
stopasgroup=true
killasgroup=true
